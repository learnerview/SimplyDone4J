name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IT_REDIS_HOST: localhost
      IT_REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set up Java 21 (Temurin) + Maven Central credentials
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # IMPORTANT: verify runs the full test suite (including live Redis tests)
      # BEFORE the deploy step. -DskipTests is never used in the release path.
      - name: Build, test & verify (full suite + JaCoCo + SpotBugs)
        run: mvn -B clean verify

      - name: Publish to Maven Central
        run: mvn -B deploy -Prelease -Dgpg.passphrase=${{ secrets.MAVEN_GPG_PASSPHRASE }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Upload SBOM as release asset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.event.release.tag_name }}
          path: target/bom.*
          if-no-files-found: ignore
