spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

simplydone4j:
  key-prefix: sd4j-test
  ttl-days: 1
  idempotency-ttl-hours: 1
  monitoring:
    enabled: false
